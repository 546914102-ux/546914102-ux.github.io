  <script>document.write('<script src="project.js?v='+Date.now()+'"><\/script>')</script>
  <script>
    (() => {
      if (new URLSearchParams(window.location.search).get("project") !== "peachy-keen") return;

      let observer;
      const replacePeachyFirstImage = () => {
        const image = document.querySelector(
          "main > section.project-gallery:nth-of-type(3) > figure:nth-of-type(1) > img"
        );
        if (!image) return false;

        image.src = "作品/PEACHY KEEN/汽水mv排版2.jpg";
      image.alt = "Peachy Keen project long presentation";
        observer?.disconnect();
        return true;
      };

      if (!replacePeachyFirstImage()) {
        observer = new MutationObserver(replacePeachyFirstImage);
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
<script src="peachy-first-image-override.js"></script>
</body>
